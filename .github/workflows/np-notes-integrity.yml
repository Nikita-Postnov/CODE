name: NP Notes integrity checks

on:
  push:
    branches: [main]
    paths:
      - "Other_dev/noteapp/**"
      - "Other_dev/notes_app.py"
      - "tests/test_np_notes_integrity.py"
      - "tests/test_np_notes_hardening.py"
      - "tests/test_np_notes_safety_20261125.py"
      - "tests/test_np_notes_qt_smoke.py"
      - "tests/test_np_notes_search_benchmark.py"
      - "tests/test_np_notes_recovery.py"
      - "tools/benchmark_np_notes_search.py"
      - "tools/benchmark_np_notes_qt_search.py"
      - ".github/workflows/np-notes-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "Other_dev/noteapp/**"
      - "Other_dev/notes_app.py"
      - "tests/test_np_notes_integrity.py"
      - "tests/test_np_notes_hardening.py"
      - "tests/test_np_notes_safety_20261125.py"
      - "tests/test_np_notes_qt_smoke.py"
      - "tests/test_np_notes_search_benchmark.py"
      - "tests/test_np_notes_recovery.py"
      - "tools/benchmark_np_notes_search.py"
      - "tools/benchmark_np_notes_qt_search.py"
      - ".github/workflows/np-notes-integrity.yml"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q Other_dev/noteapp Other_dev/notes_app.py
      - name: Validate backups, portability, autosave, plugins, attachments
        run: python -m unittest -v tests.test_np_notes_integrity tests.test_np_notes_hardening tests.test_np_notes_safety_20261125 tests.test_np_notes_search_benchmark tests.test_np_notes_recovery
      - name: Benchmark synthetic notes search (100 / 1000 / 10000)
        run: python tools/benchmark_np_notes_search.py --notes 100,1000,10000 --repeats 3

  qt-editor-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt dependencies
        run: python -m pip install "PySide6>=6.7,<7"
      - name: Exercise Qt editor without real user data
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_np_notes_qt_smoke
      - name: Benchmark synthetic QTextDocument search
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/benchmark_np_notes_qt_search.py --notes 100,1000,10000 --repeats 3
