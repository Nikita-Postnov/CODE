name: NP Notes integrity checks

on:
  push:
    branches: [main]
    paths:
      - "Other_dev/noteapp/**"
      - "Other_dev/notes_app.py"
      - "tests/test_np_notes_integrity.py"
      - "tests/test_np_notes_hardening.py"
      - ".github/workflows/np-notes-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "Other_dev/noteapp/**"
      - "Other_dev/notes_app.py"
      - "tests/test_np_notes_integrity.py"
      - "tests/test_np_notes_hardening.py"
      - ".github/workflows/np-notes-integrity.yml"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q Other_dev/noteapp Other_dev/notes_app.py
      - name: Validate backups, portability, autosave, plugins, attachments
        run: python -m unittest -v tests.test_np_notes_integrity tests.test_np_notes_hardening
