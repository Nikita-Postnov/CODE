name: Choice portable, health and integration tests

on:
  pull_request:
    paths:
      - "Choice/**"
      - "Other_dev/punto_like_work_safe.py"
      - ".github/workflows/choice-integration-tests.yml"
  workflow_dispatch:

jobs:
  choice-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install Qt test dependencies
        run: python -m pip install PySide6
      - name: Compile changed modules
        run: python -m py_compile Choice/choice_dev.py Choice/choice_features.py Choice/choice_integration.py Choice/choice_portability.py Other_dev/punto_like_work_safe.py
      - name: Run Choice tests
        run: python -m unittest discover -s Choice -p "test_*.py" -v
