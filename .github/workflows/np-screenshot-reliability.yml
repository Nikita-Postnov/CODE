name: NP Screenshot reliability and delayed capture

on:
  push:
    branches: [main]
    paths:
      - "Other_dev/screenshot.py"
      - "tests/test_np_screenshot_reliability.py"
      - "tests/test_np_screenshot_window_capture.py"
      - "tests/test_np_screenshot_history.py"
      - ".github/workflows/np-screenshot-reliability.yml"
  pull_request:
    branches: [main]
    paths:
      - "Other_dev/screenshot.py"
      - "tests/test_np_screenshot_reliability.py"
      - "tests/test_np_screenshot_window_capture.py"
      - "tests/test_np_screenshot_history.py"
      - ".github/workflows/np-screenshot-reliability.yml"

jobs:
  screenshot:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0
      - name: Install Qt
        run: python -m pip install PySide6==6.8.3
      - name: Compile screenshot
        run: python -m py_compile Other_dev/screenshot.py
      - name: Run screenshot reliability tests
        run: python -m unittest discover -s tests -p "test_np_screenshot*.py" -v
