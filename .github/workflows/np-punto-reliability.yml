name: NP Punto reliability

on:
  push:
    branches: [main]
    paths:
      - "Other_dev/punto_like_work_safe.py"
      - "Other_dev/test_punto_input_layout_sync.py"
      - "Other_dev/NP_Punto_Browser/**"
      - "tests/test_np_punto_browser.cjs"
      - "tests/test_np_punto_browser_dom.cjs"
      - "tests/test_np_punto_browser_native_bridge.cjs"
      - "tests/test_np_punto_browser_prosemirror.cjs"
      - "tests/test_np_punto_browser_options.cjs"
      - "tests/test_np_punto_browser_bridge.py"
      - "tests/test_np_punto_reliability.py"
      - "tests/test_np_punto_hotkey_priority.py"
      - "tests/test_np_punto_chromium_copy.py"
      - "tests/test_np_punto_scintilla.py"
      - "tests/test_np_punto_scintilla_native.py"
      - "tests/test_np_punto_raw_hotkey_diagnostic.py"
      - ".github/workflows/np-punto-reliability.yml"
  pull_request:
    branches: [main]
    paths:
      - "Other_dev/punto_like_work_safe.py"
      - "Other_dev/test_punto_input_layout_sync.py"
      - "Other_dev/NP_Punto_Browser/**"
      - "tests/test_np_punto_browser.cjs"
      - "tests/test_np_punto_browser_dom.cjs"
      - "tests/test_np_punto_browser_native_bridge.cjs"
      - "tests/test_np_punto_browser_prosemirror.cjs"
      - "tests/test_np_punto_browser_options.cjs"
      - "tests/test_np_punto_browser_bridge.py"
      - "tests/test_np_punto_reliability.py"
      - "tests/test_np_punto_hotkey_priority.py"
      - "tests/test_np_punto_chromium_copy.py"
      - "tests/test_np_punto_scintilla.py"
      - "tests/test_np_punto_scintilla_native.py"
      - "tests/test_np_punto_raw_hotkey_diagnostic.py"
      - ".github/workflows/np-punto-reliability.yml"

jobs:
  punto:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate browser extension
        run: |
          python -m json.tool Other_dev/NP_Punto_Browser/manifest.json
          node --check Other_dev/NP_Punto_Browser/layout_core.js
          node --check Other_dev/NP_Punto_Browser/content.js
          node --check Other_dev/NP_Punto_Browser/background.js
          node --check tests/test_np_punto_browser_native_bridge.cjs
          node --check Other_dev/NP_Punto_Browser/options.js
          node --check tests/test_np_punto_browser_dom.cjs
          node --check tests/test_np_punto_browser_prosemirror.cjs
          node --check tests/test_np_punto_browser_options.cjs
      - name: Test browser layout engine
        run: node --test tests/test_np_punto_browser.cjs tests/test_np_punto_browser_dom.cjs tests/test_np_punto_browser_native_bridge.cjs tests/test_np_punto_browser_prosemirror.cjs tests/test_np_punto_browser_options.cjs
      - name: Compile native Windows browser host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $compiler)) { throw 'C# compiler missing' }
          $exe = Join-Path $env:RUNNER_TEMP 'PuntoLayoutHost.exe'
          & $compiler /nologo /target:exe /reference:System.Web.Extensions.dll "/out:$exe" Other_dev/NP_Punto_Browser/native_host/PuntoLayoutHost.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile NP Punto
        run: python -m py_compile Other_dev/punto_like_work_safe.py
      - name: Validate NP Punto safety
        run: python -m unittest -v tests.test_np_punto_reliability tests.test_np_punto_hotkey_priority tests.test_np_punto_chromium_copy tests.test_np_punto_scintilla tests.test_np_punto_scintilla_native tests.test_np_punto_raw_hotkey_diagnostic tests.test_np_punto_browser_bridge
      - name: Verify Windows input language follows the corrected word
        run: python Other_dev/test_punto_input_layout_sync.py -v
