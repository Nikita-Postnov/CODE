name: NP Screenshot NPCore clipboard checks

on:
  pull_request:
    branches: [main]
    paths:
      - "Other_dev/screenshot.py"
      - "tests/test_np_screenshot_npcore_storage.py"
      - ".github/workflows/np-screenshot-npcore-clipboard.yml"

jobs:
  npcore-clipboard:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0
      - name: Install PySide6
        run: python -m pip install PySide6==6.8.3
      - name: Compile
        run: python -m py_compile Other_dev/screenshot.py tests/test_np_screenshot_npcore_storage.py
      - name: Run focused NPCore clipboard tests
        timeout-minutes: 2
        run: python -m unittest discover -s tests -p "test_np_screenshot_npcore_storage.py" -v
