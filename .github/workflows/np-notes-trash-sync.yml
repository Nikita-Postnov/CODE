name: NP Notes encrypted Trash sync (synthetic only)

on:
  pull_request:
    paths:
      - "Other_dev/noteapp/**"
      - "tests/test_np_notes_*.py"
      - ".github/workflows/np-notes-trash-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    name: Synthetic sync tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test-only encryption dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=43,<47"
      - name: Compile changed modules without importing GUI
        run: python -m compileall -q Other_dev/noteapp/encrypted_sync.py Other_dev/noteapp/offline_sync.py Other_dev/noteapp/sync_service.py Other_dev/noteapp/app/__init__.py tests/test_np_notes_trash_delete_sync.py
      - name: Isolated synthetic regression suite
        run: python -m unittest -v tests.test_np_notes_trash_delete_sync tests.test_np_notes_sync_service tests.test_np_notes_offline_sync tests.test_np_notes_encrypted_sync tests.test_np_notes_sync_snapshot tests.test_np_notes_incoming_sync tests.test_np_notes_sync_privacy tests.test_np_notes_sync_credentials
