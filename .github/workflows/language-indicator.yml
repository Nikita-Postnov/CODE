name: Language Indicator validation

on:
  push:
    paths:
      - 'Other_dev/Language_indicator.py'
      - 'tests/test_language_indicator_config.py'
      - '.github/workflows/language-indicator.yml'
  pull_request:
    paths:
      - 'Other_dev/Language_indicator.py'
      - 'tests/test_language_indicator_config.py'
      - '.github/workflows/language-indicator.yml'
  workflow_dispatch:

jobs:
  language-indicator:
    name: language-indicator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows GUI smoke-test dependency
        if: runner.os == 'Windows'
        run: python -m pip install PyQt6
      - name: Validate syntax
        run: python -m py_compile Other_dev/Language_indicator.py
      - name: Validate portable config and UI wiring
        run: python -m unittest discover -s tests -p test_language_indicator_config.py -v
