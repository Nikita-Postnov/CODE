name: Choice taskbar icon repair

on:
  pull_request:
    paths:
      - "tools/repair_choice_taskbar_icon.ps1"
      - ".github/workflows/choice-taskbar-icon.yml"
  workflow_dispatch:

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dry-run and pinned shortcut repair with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $script = (Resolve-Path 'tools/repair_choice_taskbar_icon.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $sandbox = Join-Path $env:RUNNER_TEMP ('choice-icon-' + [guid]::NewGuid().ToString('N'))
          $oldAppData = $env:APPDATA
          $oldUserProfile = $env:USERPROFILE
          try {
            $root = Join-Path $sandbox 'Launcher'
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $env:APPDATA = Join-Path $sandbox 'Roaming'
            $env:USERPROFILE = Join-Path $sandbox 'User'
            $pins = Join-Path $env:APPDATA 'Microsoft\Internet Explorer\Quick Launch\User Pinned\TaskBar'
            New-Item -ItemType Directory -Force -Path $pins | Out-Null
            $shell = New-Object -ComObject WScript.Shell
            $choiceLinkPath = Join-Path $pins 'Choice.lnk'
            $choiceLink = $shell.CreateShortcut($choiceLinkPath)
            $choiceLink.TargetPath = "$env:SystemRoot\System32\notepad.exe"
            $choiceLink.Arguments = '"' + (Join-Path $root 'Choice\choice_dev.py') + '"'
            $choiceLink.Save()
            $otherLinkPath = Join-Path $pins 'Other.lnk'
            $otherLink = $shell.CreateShortcut($otherLinkPath)
            $otherLink.TargetPath = "$env:SystemRoot\System32\notepad.exe"
            $otherLink.Save()
            $original = (Get-FileHash -LiteralPath $choiceLinkPath -Algorithm SHA256).Hash
            $dry = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -LauncherRoot $root
            if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 dry-run failed: $LASTEXITCODE" }
            if (-not (($dry | Out-String) -match 'MODE=DRY_RUN')) { throw 'Dry-run marker absent' }
            if ((Get-FileHash -LiteralPath $choiceLinkPath -Algorithm SHA256).Hash -ne $original) {
              throw 'Dry-run changed a pinned shortcut'
            }
            $otherBefore = (Get-FileHash -LiteralPath $otherLinkPath -Algorithm SHA256).Hash
            $actual = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -LauncherRoot $root -Apply
            if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 repair failed: $LASTEXITCODE" }
            if (-not (($actual | Out-String) -match 'STATUS=ICON_ASSIGNED')) { throw 'Icon repair marker absent' }
            $icon = Join-Path $root 'Choice_Taskbar.ico'
            if (-not (Test-Path -LiteralPath $icon)) { throw 'Choice icon not created' }
            $bytes = [IO.File]::ReadAllBytes($icon)
            if ($bytes.Length -lt 100 -or $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1) {
              throw 'Generated ICO header invalid'
            }
            $updated = $shell.CreateShortcut($choiceLinkPath)
            if ($updated.IconLocation.IndexOf('Choice_Taskbar.ico', [StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw 'Choice shortcut icon was not updated'
            }
            if ((Get-FileHash -LiteralPath $otherLinkPath -Algorithm SHA256).Hash -ne $otherBefore) {
              throw 'Unrelated shortcut changed'
            }
          }
          finally {
            $env:APPDATA = $oldAppData
            $env:USERPROFILE = $oldUserProfile
            if (Test-Path $sandbox) { Remove-Item -LiteralPath $sandbox -Recurse -Force }
          }
